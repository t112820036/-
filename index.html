<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberNode: 電路重構 - 20關邏輯解謎</title>
  <!-- Google Fonts: Orbitron & Share Tech Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       CyberNode Design System - 金屬賽博霓虹風格
       ========================================================================== */
    :root {
      --bg-dark: #080a0f;
      --panel-bg: #111622;
      --border-color: #2a364f;
      --neon-green: #00ff66;
      --neon-cyan: #00f3ff;
      --neon-red: #ff0055;
      --neon-gold: #ffcc00;
      --font-code: 'Share Tech Mono', monospace;
      --font-title: 'Orbitron', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #1a2233 0%, var(--bg-dark) 100%);
      color: var(--neon-cyan);
      font-family: var(--font-code);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* CRT 螢幕復古掃描線與濾鏡 */
    .crt-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.02),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.02)
      );
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      z-index: 999;
    }

    /* 主遊戲框架 */
    .game-wrapper {
      width: 90%;
      max-width: 800px;
      background: var(--panel-bg);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 
        0 0 30px rgba(0, 243, 255, 0.2),
        inset 0 0 15px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* 頂部標題與控制欄 */
    .game-header {
      background: #171d2c;
      padding: 15px 25px;
      border-bottom: 2px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .game-title {
      font-family: var(--font-title);
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--neon-cyan);
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
    }

    .game-subtitle {
      font-size: 0.75rem;
      color: #6a7b95;
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 5px 12px;
      font-family: var(--font-code);
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: rgba(0, 243, 255, 0.2);
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
    }

    /* 主體區域 */
    .game-body {
      padding: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 20關選關按鈕區 */
    .level-bar-label {
      font-size: 0.85rem;
      color: #8fa3c0;
      margin-bottom: 8px;
      text-align: center;
    }

    .level-selector-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 680px;
      margin-bottom: 20px;
    }

    .lvl-btn {
      padding: 8px 0;
      background: #141a26;
      border: 1px solid var(--border-color);
      color: #586980;
      font-family: var(--font-code);
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .lvl-btn:hover {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    .lvl-btn.active {
      border-color: var(--neon-cyan);
      color: #000;
      background: var(--neon-cyan);
      font-weight: bold;
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    .lvl-btn.cleared {
      border-color: var(--neon-green);
      color: var(--neon-green);
      background: rgba(0, 255, 102, 0.12);
    }

    .lvl-btn.cleared.active {
      background: var(--neon-green);
      color: #000;
      box-shadow: 0 0 10px var(--neon-green);
    }

    /* 當前關卡資訊 HUD */
    .hud-info {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 500px;
      background: #0d111a;
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud-label {
      font-size: 0.7rem;
      color: #6a7b95;
    }

    .hud-val {
      font-family: var(--font-title);
      font-size: 1.1rem;
      color: #ffffff;
      margin-top: 2px;
    }

    /* 網格區塊 */
    .arena-container {
      min-height: 280px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    .grid-3x3 {
      display: grid;
      grid-template-columns: repeat(3, 75px);
      gap: 12px;
    }

    .grid-4x4 {
      display: grid;
      grid-template-columns: repeat(4, 62px);
      gap: 10px;
    }

    .circuit-node {
      width: 100%;
      aspect-ratio: 1;
      background: #141a26;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .circuit-node::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 35%;
      height: 35%;
      border-radius: 50%;
      background: #2a364f;
      transition: all 0.2s;
    }

    /* 充能高亮狀態 */
    .circuit-node.active {
      background: rgba(0, 243, 255, 0.15);
      border-color: var(--neon-cyan);
      box-shadow: 
        0 0 15px rgba(0, 243, 255, 0.5),
        inset 0 0 10px rgba(0, 243, 255, 0.3);
    }

    .circuit-node.active::after {
      background: var(--neon-cyan);
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    /* 控制按鈕區 */
    .control-actions {
      display: flex;
      gap: 15px;
    }

    .btn-cyber {
      background: linear-gradient(180deg, #1e2838 0%, #101622 100%);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-family: var(--font-title);
      font-size: 0.9rem;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 4px;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .btn-cyber:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 15px var(--neon-cyan);
    }

    .btn-cyber:disabled {
      border-color: #2a364f;
      color: #415068;
      background: #101622;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* 破關與訊息通知 Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(5, 7, 10, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-panel {
      background: linear-gradient(135deg, #1a2233 0%, #0d111a 100%);
      border: 2px solid var(--neon-green);
      padding: 35px;
      border-radius: 8px;
      text-align: center;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.3);
    }

    .modal-title {
      font-family: var(--font-title);
      font-size: 1.8rem;
      color: var(--neon-green);
      text-shadow: 0 0 10px var(--neon-green);
      margin-bottom: 10px;
    }

    .modal-desc {
      color: #a0aec0;
      font-size: 0.95rem;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    /* 響應式微調 */
    @media (max-width: 600px) {
      .level-selector-grid { grid-template-columns: repeat(5, 1fr); }
      .grid-3x3 { grid-template-columns: repeat(3, 60px); }
      .grid-4x4 { grid-template-columns: repeat(4, 50px); }
      .game-title { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

  <div class="crt-overlay"></div>

  <div class="game-wrapper">
    <!-- 頂部欄 -->
    <header class="game-header">
      <div>
        <h1 class="game-title">CyberNode // 電路重構</h1>
        <p class="game-subtitle">20-LEVEL CIRCUIT MATRIX PUZZLE</p>
      </div>
      <div class="header-actions">
        <button id="sound-btn" class="btn-icon">音效: ON</button>
        <button id="reset-progress-btn" class="btn-icon" style="border-color:var(--neon-red); color:var(--neon-red);">重設進度</button>
      </div>
    </header>

    <!-- 遊戲主要內容 -->
    <main class="game-body">
      <div class="level-bar-label">SELECT CIRCUIT STAGE (關卡選擇)</div>
      
      <!-- 20關快速選擇切換區 -->
      <div id="level-grid" class="level-selector-grid"></div>

      <!-- HUD 當前數據 -->
      <div class="hud-info">
        <div class="hud-item">
          <span class="hud-label">當前關卡</span>
          <span id="hud-level" class="hud-val">01 / 20</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">晶片陣列</span>
          <span id="hud-grid-size" class="hud-val">3 x 3</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">當前步數</span>
          <span id="hud-steps" class="hud-val">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">理論最少步數</span>
          <span id="hud-min-steps" class="hud-val">1</span>
        </div>
      </div>

      <!-- 電路節點網格 -->
      <div class="arena-container">
        <div id="circuit-arena"></div>
      </div>

      <!-- 控制按鈕 -->
      <div class="control-actions">
        <button id="btn-restart" class="btn-cyber">重置本關</button>
        <button id="btn-prev" class="btn-cyber">上一關</button>
        <button id="btn-next" class="btn-cyber">下一關</button>
      </div>
    </main>
  </div>

  <!-- 20關全部通關 Modal -->
  <div id="win-modal" class="modal-overlay">
    <div class="modal-panel">
      <h2 class="modal-title">SYSTEM RECONFIGURED</h2>
      <p class="modal-desc">
        恭喜！您已成功解開全部 20 個電路連鎖節點，完成高階晶片過載重構！
      </p>
      <button id="modal-close-btn" class="btn-cyber" style="border-color:var(--neon-green); color:var(--neon-green);">返回關卡</button>
    </div>
  </div>

  <script>
    /**
     * CyberNode Logic Engine
     */
    document.addEventListener('DOMContentLoaded', () => {
      // 20 關邏輯預設值 (確保 100% 均可順利解開)
      const LEVELS_DATA = [
        // 3x3 陣列 (1 - 10 關)
        { level: 1,  gridSize: 3, minSteps: 1, board: [true, false, true, false, false, false, true, false, true] },
        { level: 2,  gridSize: 3, minSteps: 1, board: [false, false, true, false, true, true, true, true, true] },
        { level: 3,  gridSize: 3, minSteps: 1, board: [false, false, false, true, false, true, true, true, true] },
        { level: 4,  gridSize: 3, minSteps: 2, board: [false, false, true, false, true, false, true, false, false] },
        { level: 5,  gridSize: 3, minSteps: 2, board: [true, false, false, false, true, false, false, false, true] },
        { level: 6,  gridSize: 3, minSteps: 2, board: [false, false, false, true, true, true, false, false, false] },
        { level: 7,  gridSize: 3, minSteps: 2, board: [false, true, false, false, true, false, false, true, false] },
        { level: 8,  gridSize: 3, minSteps: 3, board: [false, true, false, false, true, true, true, false, false] },
        { level: 9,  gridSize: 3, minSteps: 3, board: [false, true, false, false, false, false, false, true, false] },
        { level: 10, gridSize: 3, minSteps: 3, board: [false, true, true, true, false, true, true, true, false] },
        
        // 4x4 陣列 (11 - 20 關)
        { level: 11, gridSize: 4, minSteps: 2, board: [true, false, true, true, false, false, true, true, true, true, false, false, true, true, false, true] },
        { level: 12, gridSize: 4, minSteps: 2, board: [false, false, true, true, false, true, true, true, true, true, true, false, true, true, false, false] },
        { level: 13, gridSize: 4, minSteps: 4, board: [false, false, false, false, false, true, true, false, false, true, true, false, false, false, false, false] },
        { level: 14, gridSize: 4, minSteps: 4, board: [true, false, false, true, false, false, false, false, false, false, false, false, true, false, false, true] },
        { level: 15, gridSize: 4, minSteps: 4, board: [false, true, true, false, true, false, false, true, true, false, false, true, false, true, true, false] },
        { level: 16, gridSize: 4, minSteps: 4, board: [false, true, true, true, true, false, true, true, true, true, false, true, true, true, true, false] },
        { level: 17, gridSize: 4, minSteps: 4, board: [true, true, true, false, true, true, false, true, true, false, true, true, false, true, true, true] },
        { level: 18, gridSize: 4, minSteps: 4, board: [true, false, false, true, false, true, true, false, false, true, true, false, true, false, false, true] },
        { level: 19, gridSize: 4, minSteps: 6, board: [false, false, false, false, false, false, false, true, false, false, false, true, false, true, true, false] },
        { level: 20, gridSize: 4, minSteps: 8, board: [false, true, true, false, true, false, false, true, true, false, false, true, false, true, true, false] }
      ];

      // 遊戲狀態變數
      let currentLevel = 1;
      let currentBoard = [];
      let stepCount = 0;
      let soundEnabled = true;
      let clearedLevels = JSON.parse(localStorage.getItem('cybernode_cleared') || '[]');

      // DOM 元素引用
      const levelGrid = document.getElementById('level-grid');
      const circuitArena = document.getElementById('circuit-arena');
      const hudLevel = document.getElementById('hud-level');
      const hudGridSize = document.getElementById('hud-grid-size');
      const hudSteps = document.getElementById('hud-steps');
      const hudMinSteps = document.getElementById('hud-min-steps');

      const btnRestart = document.getElementById('btn-restart');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      const soundBtn = document.getElementById('sound-btn');
      const resetProgressBtn = document.getElementById('reset-progress-btn');

      const winModal = document.getElementById('win-modal');
      const modalCloseBtn = document.getElementById('modal-close-btn');

      // Web Audio API 音效引擎
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      function playSound(type) {
        if (!soundEnabled) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.exponentialRampToValueAtTime(250, now + 0.05);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'clear') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
          osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'win') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.frequency.value = freq;
            g.gain.setValueAtTime(0.15, now + i * 0.1);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
            o.start(now + i * 0.1);
            o.stop(now + i * 0.1 + 0.3);
          });
        }
      }

      // 渲染頂部 20 關選擇器
      function renderLevelSelector() {
        levelGrid.innerHTML = '';
        for (let i = 1; i <= 20; i++) {
          const btn = document.createElement('button');
          btn.className = `lvl-btn ${i === currentLevel ? 'active' : ''} ${clearedLevels.includes(i) ? 'cleared' : ''}`;
          btn.textContent = String(i).padStart(2, '0');
          btn.addEventListener('click', () => {
            playSound('click');
            loadLevel(i);
          });
          levelGrid.appendChild(btn);
        }
      }

      // 載入關卡
      function loadLevel(lvlNum) {
        currentLevel = lvlNum;
        stepCount = 0;
        const data = LEVELS_DATA[lvlNum - 1];
        currentBoard = [...data.board];

        // 更新 HUD
        hudLevel.textContent = `${String(lvlNum).padStart(2, '0')} / 20`;
        hudGridSize.textContent = `${data.gridSize} x ${data.gridSize}`;
        hudSteps.textContent = '0';
        hudMinSteps.textContent = data.minSteps;

        // 更新按鈕狀態
        btnPrev.disabled = (currentLevel === 1);
        btnNext.disabled = (currentLevel === 20);

        renderLevelSelector();
        renderArenaGrid();
      }

      // 渲染電路網格
      function renderArenaGrid() {
        circuitArena.innerHTML = '';
        const data = LEVELS_DATA[currentLevel - 1];
        circuitArena.className = (data.gridSize === 3) ? 'grid-3x3' : 'grid-4x4';

        currentBoard.forEach((state, idx) => {
          const node = document.createElement('div');
          node.className = `circuit-node ${state ? 'active' : ''}`;
          node.addEventListener('click', () => handleNodeClick(idx));
          circuitArena.appendChild(node);
        });
      }

      // 點擊節點翻轉邏輯
      function handleNodeClick(idx) {
        playSound('click');
        stepCount++;
        hudSteps.textContent = stepCount;

        const data = LEVELS_DATA[currentLevel - 1];
        const size = data.gridSize;

        // 計算受影響的鄰居 (十字翻轉)
        const targets = [idx];
        if (idx % size > 0) targets.push(idx - 1);         // 左
        if (idx % size < size - 1) targets.push(idx + 1); // 右
        if (idx >= size) targets.push(idx - size);        // 上
        if (idx < size * (size - 1)) targets.push(idx + size); // 下

        targets.forEach(t => {
          currentBoard[t] = !currentBoard[t];
        });

        renderArenaGrid();
        checkVictory();
      }

      // 檢查是否所有晶片節點皆已充能 (全為 true)
      function checkVictory() {
        if (currentBoard.every(s => s === true)) {
          // 標記通關
          if (!clearedLevels.includes(currentLevel)) {
            clearedLevels.push(currentLevel);
            localStorage.setItem('cybernode_cleared', JSON.stringify(clearedLevels));
          }

          renderLevelSelector();

          // 是否為最終全通關
          if (clearedLevels.length === 20) {
            playSound('win');
            setTimeout(() => {
              winModal.classList.add('active');
            }, 300);
          } else {
            playSound('clear');
            // 提示通關並自動前往下一關
            if (currentLevel < 20) {
              setTimeout(() => {
                loadLevel(currentLevel + 1);
              }, 400);
            }
          }
        }
      }

      // 按鈕事件綁定
      btnRestart.addEventListener('click', () => {
        playSound('click');
        loadLevel(currentLevel);
      });

      btnPrev.addEventListener('click', () => {
        if (currentLevel > 1) {
          playSound('click');
          loadLevel(currentLevel - 1);
        }
      });

      btnNext.addEventListener('click', () => {
        if (currentLevel < 20) {
          playSound('click');
          loadLevel(currentLevel + 1);
        }
      });

      soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundBtn.textContent = `音效: ${soundEnabled ? 'ON' : 'OFF'}`;
      });

      resetProgressBtn.addEventListener('click', () => {
        if (confirm('確定要重設所有 20 關的通關紀錄嗎？')) {
          clearedLevels = [];
          localStorage.removeItem('cybernode_cleared');
          playSound('click');
          loadLevel(1);
        }
      });

      modalCloseBtn.addEventListener('click', () => {
        winModal.classList.remove('active');
      });

      // 初始化遊戲
      loadLevel(currentLevel);
    });
  </script>
</body>
</html>
